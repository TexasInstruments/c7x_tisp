[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolib-codegen"
version = "0.1.0"
description = "A Python package for generating audio library kernel code"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Proprietary"}
authors = [
    {name = "Audio Library Team"}
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0",
    "matplotlib",
    "scipy",
    "audiocomplib",
    "pandas"
]

[tool.setuptools]
packages = ["common"]

[tool.black]
line-length = 88
target-version = ["py37"]

[tool.isort]
profile = "black"
line_length = 88
