<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">TableSourceRowColSelector</text>
  <text x="450" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Row select (isColSelect = 0), non-interleaved output</text>

  <!-- column headings -->
  <text x="115" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Index (int32)</text>
  <text x="451" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Table</text>
  <text x="744" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Output</text>

  <!-- index input: one row per index -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">
    <rect x="80" y="95" width="70" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="115" y="121">2</text>
    <rect x="80" y="145" width="70" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="115" y="171">0</text>
    <rect x="80" y="195" width="70" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="115" y="221">7</text>
    <rect x="80" y="245" width="70" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="115" y="271">-1</text>
  </g>

  <!-- table: row number column + 2 data columns -->
  <text x="387" y="113" text-anchor="middle" font-size="11" fill="#64748b">row</text>
  <g font-size="14" text-anchor="middle">
    <rect x="370" y="120" width="34" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="387" y="145" font-weight="700" fill="#475569">0</text>
    <rect x="404" y="120" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="436" y="145" fill="#1e3a8a">0.1</text>
    <rect x="468" y="120" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="145" fill="#1e3a8a">0.2</text>

    <rect x="370" y="170" width="34" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="387" y="195" font-weight="700" fill="#475569">1</text>
    <rect x="404" y="170" width="64" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="436" y="195" fill="#92400e">1.1</text>
    <rect x="468" y="170" width="64" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="500" y="195" fill="#92400e">1.2</text>

    <rect x="370" y="220" width="34" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="387" y="245" font-weight="700" fill="#475569">2</text>
    <rect x="404" y="220" width="64" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="436" y="245" fill="#14532d">2.1</text>
    <rect x="468" y="220" width="64" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="245" fill="#14532d">2.2</text>
  </g>

  <!-- each index selects a table row (dashed: out of range, clamped) -->
  <g fill="none" stroke-width="2.5">
    <path d="M150,115 C260,115 260,240 362,240" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
    <path d="M150,165 C260,165 260,140 362,140" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
    <path d="M150,215 C260,215 260,240 362,240" stroke="#16a34a" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
    <path d="M150,265 C260,265 260,140 362,140" stroke="#2563eb" stroke-dasharray="7 5" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- the selected row is copied to the output row of that index -->
  <g fill="none" stroke-width="2.5">
    <path d="M532,240 C604,240 604,115 672,115" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
    <path d="M532,140 C604,140 604,165 672,165" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
    <path d="M532,240 C604,240 604,215 672,215" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
    <path d="M532,140 C604,140 604,265 672,265" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- output: one table row per index -->
  <g font-size="14" text-anchor="middle">
    <rect x="680" y="95" width="64" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="712" y="120" fill="#14532d">2.1</text>
    <rect x="744" y="95" width="64" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="776" y="120" fill="#14532d">2.2</text>

    <rect x="680" y="145" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="712" y="170" fill="#1e3a8a">0.1</text>
    <rect x="744" y="145" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="776" y="170" fill="#1e3a8a">0.2</text>

    <rect x="680" y="195" width="64" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="712" y="220" fill="#14532d">2.1</text>
    <rect x="744" y="195" width="64" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="776" y="220" fill="#14532d">2.2</text>

    <rect x="680" y="245" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="712" y="270" fill="#1e3a8a">0.1</text>
    <rect x="744" y="245" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="776" y="270" fill="#1e3a8a">0.2</text>
  </g>

  <text x="450" y="320" text-anchor="middle" font-size="13" fill="#64748b">Each index copies one table row to its output row. Dashed: index out of range, clamped to the nearest row.</text>
  <line x1="40" y1="345" x2="860" y2="345" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Column select (isColSelect = 1), interleaved output</text>

  <text x="145" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Index (int32)</text>
  <text x="440" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Table</text>
  <text x="752" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Output</text>

  <!-- index input: colour = selected table column; dashed = clamped -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <rect x="40" y="470" width="50" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="65" y="495" fill="#92400e">2</text>
    <rect x="95" y="470" width="50" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="495" fill="#1e3a8a">0</text>
    <rect x="150" y="470" width="50" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="175" y="495" fill="#92400e">7</text>
    <rect x="205" y="470" width="50" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="230" y="495" fill="#1e3a8a">-1</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#64748b">
    <text x="65" y="530">c1</text><text x="120" y="530">c0</text><text x="175" y="530">c1</text><text x="230" y="530">c0</text>
  </g>

  <!-- table: column labels, row labels, columns c0 (blue) and c1 (orange) -->
  <g font-size="14" text-anchor="middle">
    <text x="440" y="444" font-weight="700" fill="#1e3a8a" font-size="12">c0</text>
    <text x="504" y="444" font-weight="700" fill="#92400e" font-size="12">c1</text>
    <rect x="374" y="452" width="34" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="391" y="477" font-weight="700" fill="#475569">0</text>
    <rect x="408" y="452" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="477" fill="#1e3a8a">0.1</text>
    <rect x="472" y="452" width="64" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="504" y="477" fill="#92400e">0.2</text>
    <rect x="374" y="492" width="34" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="391" y="517" font-weight="700" fill="#475569">1</text>
    <rect x="408" y="492" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="517" fill="#1e3a8a">1.1</text>
    <rect x="472" y="492" width="64" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="504" y="517" fill="#92400e">1.2</text>
    <rect x="374" y="532" width="34" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="391" y="557" font-weight="700" fill="#475569">2</text>
    <rect x="408" y="532" width="64" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="557" fill="#1e3a8a">2.1</text>
    <rect x="472" y="532" width="64" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="504" y="557" fill="#92400e">2.2</text>
    <text x="391" y="446" font-size="11" fill="#64748b">row</text>
  </g>

  <!-- the selected column is copied to the output column of that index -->
  <g fill="none" stroke-width="2.5">
    <path d="M260,490 C310,490 320,512 366,512" stroke="#64748b" marker-end="url(#arrowGrey)"/>
    <path d="M544,512 C580,512 590,512 632,512" stroke="#64748b" marker-end="url(#arrowGrey)"/>
  </g>

  <!-- output: one table column per index -->
  <g font-size="14" text-anchor="middle">
    <rect x="640" y="452" width="56" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="668" y="477" fill="#92400e">0.2</text>
    <rect x="640" y="492" width="56" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="668" y="517" fill="#92400e">1.2</text>
    <rect x="640" y="532" width="56" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="668" y="557" fill="#92400e">2.2</text>
    <rect x="696" y="452" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="724" y="477" fill="#1e3a8a">0.1</text>
    <rect x="696" y="492" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="724" y="517" fill="#1e3a8a">1.1</text>
    <rect x="696" y="532" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="724" y="557" fill="#1e3a8a">2.1</text>
    <rect x="752" y="452" width="56" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="780" y="477" fill="#92400e">0.2</text>
    <rect x="752" y="492" width="56" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="780" y="517" fill="#92400e">1.2</text>
    <rect x="752" y="532" width="56" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="780" y="557" fill="#92400e">2.2</text>
    <rect x="808" y="452" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="836" y="477" fill="#1e3a8a">0.1</text>
    <rect x="808" y="492" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="836" y="517" fill="#1e3a8a">1.1</text>
    <rect x="808" y="532" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="836" y="557" fill="#1e3a8a">2.1</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#64748b">
    <text x="668" y="586">idx 0</text><text x="724" y="586">idx 1</text><text x="780" y="586">idx 2</text><text x="836" y="586">idx 3</text>
  </g>

  <text x="450" y="620" text-anchor="middle" font-size="13" fill="#64748b">Each index copies one table column to its output column (colour = selected column). Dashed: clamped (2 and 7 to c1, -1 to c0).</text>
</svg>
