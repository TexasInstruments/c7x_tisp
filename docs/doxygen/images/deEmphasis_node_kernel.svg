<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="270" viewBox="0 0 1560 270" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1560" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="780" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DeEmphasis: block diagram</text>

  <rect x="30" y="112" width="180" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Input x</text>
  <text x="120" y="162" text-anchor="middle" font-size="12.5" fill="#92400e">M channels × N samples</text>
  <text x="120" y="181" text-anchor="middle" font-size="12.5" fill="#92400e">interleaved or planar</text>
  <rect x="1350" y="112" width="180" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1440" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Output y</text>
  <text x="1440" y="162" text-anchor="middle" font-size="12.5" fill="#92400e">same layout as input</text>
  <rect x="250" y="112" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Load state</text>
  <text x="340" y="162" text-anchor="middle" font-size="12.5" fill="#115e59">prev = yPrev[ch]</text>
  <text x="340" y="181" text-anchor="middle" font-size="12.5" fill="#115e59">from the last frame</text>
  <line x1="430" y1="164" x2="468" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="112" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="560" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Read sample</text>
  <text x="560" y="162" text-anchor="middle" font-size="12.5" fill="#115e59">x = in[ch][n]</text>
  <line x1="650" y1="164" x2="688" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="112" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="780" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Filter</text>
  <text x="780" y="162" text-anchor="middle" font-size="12.5" fill="#115e59">prev = x + α · prev</text>
  <line x1="870" y1="164" x2="908" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910" y="112" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="1000" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Write output</text>
  <text x="1000" y="162" text-anchor="middle" font-size="12.5" fill="#115e59">out[ch][n] = prev</text>
  <line x1="1090" y1="164" x2="1128" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1130" y="112" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="1220" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Save state</text>
  <text x="1220" y="162" text-anchor="middle" font-size="12.5" fill="#115e59">yPrev[ch] = prev</text>
  <text x="1220" y="181" text-anchor="middle" font-size="12.5" fill="#115e59">after the last sample</text>
  <line x1="210" y1="164" x2="248" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1310" y1="164" x2="1348" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1220,112 C 1220,72 340,72 340,110" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="780" y="78" text-anchor="middle" font-size="12" fill="#64748b">state carries across frames</text>
  <text x="780" y="260" text-anchor="middle" font-size="12" fill="#64748b">per channel; steps 2-4 repeat for n = 0 .. N-1; step 5 stores the state used by the next frame</text>
</svg>
