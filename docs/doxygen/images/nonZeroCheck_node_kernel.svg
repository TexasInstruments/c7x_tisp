<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="244" viewBox="0 0 1340 244" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1340" height="244" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="670" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">NonZeroCheck: block diagram</text>

  <rect x="30" y="86" width="180" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Input x</text>
  <text x="120" y="136" text-anchor="middle" font-size="12.5" fill="#92400e">width × height</text>
  <text x="120" y="155" text-anchor="middle" font-size="12.5" fill="#92400e">type T</text>
  <rect x="1130" y="86" width="180" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1220" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Output y</text>
  <text x="1220" y="136" text-anchor="middle" font-size="12.5" fill="#92400e">one row</text>
  <text x="1220" y="155" text-anchor="middle" font-size="12.5" fill="#92400e">ROW: width elements</text>
  <text x="1220" y="174" text-anchor="middle" font-size="12.5" fill="#92400e">COLUMN: height elements</text>
  <text x="250" y="78" font-size="12.5" font-weight="700" fill="#64748b">for each output element k</text>
  <rect x="250" y="86" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Initialise</text>
  <text x="340" y="136" text-anchor="middle" font-size="12.5" fill="#115e59">ALL: result = 1</text>
  <text x="340" y="155" text-anchor="middle" font-size="12.5" fill="#115e59">ANY: result = 0</text>
  <line x1="430" y1="138" x2="468" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="86" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="560" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Select elements</text>
  <text x="560" y="136" text-anchor="middle" font-size="12.5" fill="#115e59">ROW: column k</text>
  <text x="560" y="155" text-anchor="middle" font-size="12.5" fill="#115e59">COLUMN: row k</text>
  <line x1="650" y1="138" x2="688" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="86" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="780" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Test and update</text>
  <text x="780" y="136" text-anchor="middle" font-size="12.5" fill="#115e59">ALL: clear on x == 0</text>
  <text x="780" y="155" text-anchor="middle" font-size="12.5" fill="#115e59">ANY: set on x != 0</text>
  <line x1="870" y1="138" x2="908" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910" y="86" width="180" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="1000" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Write output</text>
  <text x="1000" y="136" text-anchor="middle" font-size="12.5" fill="#115e59">out[k] = result</text>
  <text x="1000" y="155" text-anchor="middle" font-size="12.5" fill="#115e59">(0 or 1, type T)</text>
  <line x1="210" y1="138" x2="248" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1090" y1="138" x2="1128" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="234" text-anchor="middle" font-size="12" fill="#64748b">ROW reduces down the rows (one result per column); COLUMN reduces across each row</text>
</svg>
