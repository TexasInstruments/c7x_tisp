<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Whitenoise node</text>

  <!-- Settings -->
  <rect x="30" y="120" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="115" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Seed + range</text>
  <text x="115" y="178" text-anchor="middle" font-size="13" fill="#92400e">set once</text>

  <line x1="200" y1="160" x2="268" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Generator -->
  <rect x="270" y="120" width="210" height="80" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="375" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">Random number</text>
  <text x="375" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">generator</text>

  <!-- fan-out to channels -->
  <line x1="480" y1="160" x2="560" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="160" x2="560" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="160" x2="560" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="160" x2="560" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Channels -->
  <rect x="562" y="66" width="230" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="677" y="91" text-anchor="middle" font-size="14" fill="#3b0764">Channel 1: own noise</text>
  <rect x="562" y="116" width="230" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="677" y="141" text-anchor="middle" font-size="14" fill="#3b0764">Channel 2: own noise</text>
  <rect x="562" y="166" width="230" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="677" y="191" text-anchor="middle" font-size="14" fill="#3b0764">Channel 3: own noise</text>
  <text x="677" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#64748b">⋮</text>
  <rect x="562" y="241" width="230" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="677" y="266" text-anchor="middle" font-size="14" fill="#3b0764">Channel N: own noise</text>

  <!-- Output -->
  <line x1="792" y1="85" x2="838" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792" y1="135" x2="838" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792" y1="185" x2="838" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792" y1="260" x2="838" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="840" y="120" width="130" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="905" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Output</text>
  <text x="905" y="186" text-anchor="middle" font-size="13" fill="#92400e">one row</text>
  <text x="905" y="203" text-anchor="middle" font-size="13" fill="#92400e">per channel</text>

  <text x="500" y="318" text-anchor="middle" font-size="14" fill="#475569">One seed gives every channel different, independent noise. Each frame carries on where the last one ended.</text>
</svg>
